<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>신규 고객 등록 · 고객노트</title><link rel="stylesheet" href="css/style.css"><script src="js/mock-data.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="new"><div id="shell"></div><main id="main"><a class="back" href="index.html">← 고객 검색으로</a><header class="page-heading"><div><p class="eyebrow">새로운 인연의 시작</p><h1>신규 고객 등록</h1><p>꼭 필요한 정보만 입력하고, 첫 이야기를 남겨보세요.</p></div></header><form id="new-form" class="panel form-panel narrow"><div class="section-heading"><h2>기본 정보</h2><span class="muted small">* 필수 입력</span></div><label>고객 이름 *<input id="new-name" required maxlength="40" autocomplete="name" placeholder="고객 이름을 입력하세요"></label><label>전화번호 *<input id="new-phone" required maxlength="20" type="tel" autocomplete="tel" placeholder="010-0000-0000"><span class="field-help">숫자 9~11자리를 입력해 주세요. 하이픈은 생략해도 돼요.</span></label><label>기본 메모 <span class="muted">(선택)</span><textarea id="new-note" rows="4" maxlength="1000" placeholder="처음 만난 고객에 대해 기억할 내용을 남겨주세요."></textarea></label><p id="form-error" class="error" role="alert"></p><div class="form-actions"><a class="button secondary" href="index.html">취소</a><button class="button primary" type="submit">고객 등록하기 →</button></div><p class="local-note">입력한 정보는 현재 브라우저에만 저장됩니다.</p></form></main></body></html>
