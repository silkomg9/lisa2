<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 · 고객노트</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body data-page="reset-password" class="auth-page auth-pending">
  <div id="auth-status" class="auth-gate" role="status"><div class="panel auth-gate-card"><p id="auth-status-message">로그인 상태를 확인하고 있어요.</p><button id="auth-retry" class="button secondary" type="button" hidden>다시 확인</button></div></div>
  <main id="auth-main" class="auth-main">
    <a class="brand auth-brand" href="index.html">고객노트</a>
    <p class="auth-intro">다시 고객의 이야기를 이어가세요.</p>
    <section class="panel auth-card">
      <h1>비밀번호 재설정</h1>
      <form id="reset-request-form" hidden>
        <p class="muted">가입한 이메일로 새 비밀번호를 설정하는 링크를 보내드립니다.</p>
        <label>이메일<input id="reset-email" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com"></label>
        <button id="reset-send" class="button primary auth-full-button" type="submit">재설정 메일 받기</button>
      </form>
      <form id="password-update-form" hidden>
        <p class="muted">새로 사용할 비밀번호를 입력해 주세요.</p>
        <label>새 비밀번호<input id="new-password" type="password" autocomplete="new-password" minlength="6" required placeholder="6자 이상 입력하세요"></label>
        <label>새 비밀번호 확인<input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required placeholder="새 비밀번호를 한 번 더 입력하세요"></label>
        <button id="password-save" class="button primary auth-full-button" type="submit">새 비밀번호 저장</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
      <p id="auth-message" class="auth-message" role="status"></p>
      <a id="reset-complete" class="button primary auth-full-button" href="index.html" hidden>고객 관리로 이동</a>
      <p class="auth-switch"><a href="login.html">로그인 화면으로</a></p>
    </section>
  </main>
  <noscript>비밀번호를 재설정하려면 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
