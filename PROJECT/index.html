<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>고객 검색 · 고객노트</title><link rel="stylesheet" href="css/style.css"><script src="js/mock-data.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="home">
<div id="shell"></div>
<main id="main">
  <header class="page-heading"><div><p class="eyebrow">우리 매장의 고객을 기억하는 방법</p><h1>고객 검색</h1><p>고객을 찾고, 지난 이야기를 이어가세요.</p></div><a class="button primary" href="new-customer.html"><span aria-hidden="true">＋</span> 신규 고객 등록</a></header>
  <section class="panel search-panel" aria-labelledby="search-title"><h2 id="search-title">어떤 고객이 방문하셨나요?</h2><p class="muted">이름이나 전화번호 일부만 입력해도 찾을 수 있어요.</p><form id="search-form" class="search-form"><label>고객 이름<input id="search-name" type="search" placeholder="이름을 입력하세요" autocomplete="off"></label><label>전화번호<input id="search-phone" type="search" inputmode="tel" placeholder="전화번호 또는 끝 4자리" autocomplete="off"></label><button class="button primary" type="submit">고객 검색 <span aria-hidden="true">↗</span></button></form></section>
  <section class="results-section" aria-labelledby="results-title"><div class="section-heading"><h2 id="results-title">전체 고객 <span id="result-count" class="count"></span></h2><span class="muted small" id="search-status" role="status"></span></div><div class="panel table-wrap"><table><thead><tr><th>고객</th><th>전화번호</th><th>마지막 방문</th><th>다음 응대 메모</th><th><span class="sr-only">상세보기</span></th></tr></thead><tbody id="customer-list"></tbody></table><div id="search-empty" class="empty" hidden><h3>검색 결과가 없어요</h3><p>이름과 전화번호를 확인하거나 처음 방문한 고객을 등록해 주세요.</p><a class="button secondary" href="new-customer.html">신규 고객 등록</a></div></div></section>
  <section aria-labelledby="recent-title"><div class="section-heading"><h2 id="recent-title">최근 조회 고객</h2><span class="muted small">최근 확인한 고객을 빠르게 찾아보세요</span></div><div id="recent-customers" class="recent-grid"></div></section>
  <aside class="tip"><span class="tip-icon" aria-hidden="true">✧</span><div><strong>한 줄의 메모가 다음 응대를 바꿔요.</strong><p>응대가 끝나면 고객 상세 화면에서 짧게 기록해 보세요.</p></div><span class="tip-end" aria-hidden="true">↗</span></aside>
</main></body></html>
